version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: essaymentor_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: projekai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/projekai
      dockerfile: Dockerfile
    container_name: essaymentor_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:rootpassword@db:3306/projekai"
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforprojekai}
      FRONTEND_URL: "http://localhost:3001"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend/projekai
      dockerfile: Dockerfile
    container_name: essaymentor_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
    ports:
      - "3001:3000"

volumes:
  mysql_data:
