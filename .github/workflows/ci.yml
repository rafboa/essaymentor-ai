name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/projekai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/projekai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Not `npm run lint`: that script passes --fix.
      - name: Lint
        run: npx eslint "{src,test,prisma}/**/*.ts"

      # Unit tests only; the e2e suite needs a database.
      - name: Unit tests
        run: npm test

      - name: Build backend
        run: npm run build

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/projekai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend & Typecheck
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Strict TypeScript typecheck
        run: bun run typecheck

